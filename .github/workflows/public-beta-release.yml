name: Lurín Comunidad - APK beta pública en GitHub Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar, verificar y publicar beta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar SDK Android
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configurar cliente online y comprobar variables
        env:
          LURIN_SUPABASE_URL: ${{ vars.LURIN_SUPABASE_URL }}
          LURIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LURIN_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/bundle_live.py --require-online
      - name: Python y navegador para pruebas de dos cuentas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow==12.0.0
          python -m playwright install --with-deps chromium
      - name: "QA realista: dos teléfonos con backend simulado"
        run: |
          python3 tests/test_security_contract.py
          python3 tests/test_logo_v04.py
          python3 tests/test_two_phones.py
          python3 tests/test_native_guest_v07.py
          python3 tests/test_identity_no_email_v08.py
      - name: Verificar proyecto Android y compilar APK
        env:
          LURIN_SUPABASE_URL: ${{ vars.LURIN_SUPABASE_URL }}
        run: |
          python3 scripts/check_project.py
          gradle :app:assembleDebug --no-daemon --stacktrace
          bash scripts/verify_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar paquete de beta pública (firma de depuración)
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "lurin-comunidad-${GITHUB_REF_NAME}-debug.apk"
          sha256sum "lurin-comunidad-${GITHUB_REF_NAME}-debug.apk" > SHA256SUMS.txt
      - name: Crear pre-release público en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "lurin-comunidad-${GITHUB_REF_NAME}-debug.apk" SHA256SUMS.txt \
            --title "Lurín Comunidad ${GITHUB_REF_NAME} - beta comunitaria" \
            --notes "APK de prueba con firma de depuración. Cuentas y publicaciones compartidas mediante Supabase independiente. Recompensas comerciales no disponibles. Requiere completar pruebas entre dos dispositivos reales antes del lanzamiento general; no es una versión para Play Store." \
            --prerelease
